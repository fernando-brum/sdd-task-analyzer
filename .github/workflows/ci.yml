# Pipeline de integração contínua do TaskAnalyzer.
# Contrato: seção 5.2 de specs/task_analyzer_spec.md (v1.2).
# Regras: DI-02 (só ações oficiais, versão fixada), DI-03 (mesmo pytest.ini
# do ambiente local), PR-07 (sem segredos) e PR-08 (nenhum teste pulado).

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  test-harness:
    name: Test Harness (Python 3.11)
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar o Test Harness
        run: pytest tests/test_harness.py -v
